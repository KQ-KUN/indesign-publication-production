name: Portable skill checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-test.txt
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: python -X utf8 scripts/indesign_runtime.py detect
      - run: python -X utf8 scripts/package_skill.py --out .artifacts/indesign-publication-production.zip
